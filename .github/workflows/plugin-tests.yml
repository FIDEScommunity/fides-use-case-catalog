name: Plugin regression tests

on:
  push:
    paths:
      - 'wordpress-plugin/**'
      - 'tests/**'
      - '.github/workflows/plugin-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'wordpress-plugin/**'
      - 'tests/**'
      - '.github/workflows/plugin-tests.yml'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: npm test
